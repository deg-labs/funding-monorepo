services:
  fetcher:
    build:
      context: ./server
      dockerfile: fetcher/Dockerfile
    container_name: funding-cmma-go-fetcher
    volumes:
      - ./server/data:/app/data
    env_file:
      - ./.env
    restart: always
    init: true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build:
      context: ./server
      dockerfile: api/Dockerfile
    container_name: funding-cmma-go-api
    depends_on:
      - fetcher
    volumes:
      - ./server/data:/app/data
    env_file:
      - ./.env
    environment:
      - DB_PATH=/app/data/cmma.db
      - HTTP_ADDR=:8000
    restart: always
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  nginx:
    build:
      context: ./server/nginx
      dockerfile: Dockerfile
    image: docker.io/library/nginx:latest
    container_name: funding-cmma-go-nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8002:80"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  funding-ncmma-notifier:
    build:
      context: ./client/ncmma
      dockerfile: Dockerfile
    container_name: funding-ncmma-notifier
    env_file:
      - ./.env
    depends_on:
      - nginx
    volumes:
      - ./client/ncmma/logs:/app/logs
      - ./client/ncmma/cache:/app/cache
      - ./client/ncmma/data:/app/data
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
